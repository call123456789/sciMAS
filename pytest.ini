[pytest]
testpaths = tests
# `tests/` is not a package (no __init__.py), so pytest would otherwise put
# tests/ on sys.path instead of the repo root and `import orchestrator` fails.
pythonpath = .
markers =
    live: calls the real Claude CLI (network, cost, non-deterministic). Excluded by default.
# Deterministic by default; run the real-CLI tests with `pytest -m live`.
addopts = -m "not live"
