# Conda environment for sciMAS (scientific multi-agent system).
# Recreates a Python env with chemistry and pharma/MADD-tool requirements:
#   rdkit        — SMILES parsing, 3D conformers, Lipinski, SMARTS matching,
#                  drug-likeness descriptors, molecule rendering
#   numpy/scipy  — numerics, ODE kinetics solver, signal processing
#   scikit-learn — PCA, StandardScaler, MADD legacy pickle loading
#   pandas       — tabular data I/O for environmental and pharma workflows
#   matplotlib   — spectrum/composition plots
#   requests     — PubChem / CIR / BindingDB / ChEMBL / MADD HTTP lookups
#   torch stack  — local MADD GAN/CVAE generation checkpoints
#   mcp          — Model Context Protocol SDK (pip)
#   biomni stack — BiOMNI Python tools and DrugDiscoveryBench image-history
#                  extras used by the local Biomni checkout at ../Biomni
#   smdd stack   — native libraries needed by the official SMDD-Bench
#                  evaluator metrics: RDKit, OpenBabel, PLIP, Boltz,
#                  Biotite, ADMET-AI, chemprop, and related chemistry tools
#
# Usage:
#   conda env create -f environment.yml
#   conda activate scimas
#   python run.py "..."
#
# MADD compatibility notes:
# - MADD's generative requirements pin scikit-learn==1.2.2. The local
#   .pkl checkpoints fail to load under newer scikit-learn releases.
# - python=3.11 is pinned because scikit-learn 1.2.2 does not support
#   the Python 3.14 environment that conda selected from python>=3.11.
# - The AutoDL Biomni recreation installed numpy 2.x, pandas 2.3+, and
#   rdkit 2026.03 via pip. sciMAS keeps the older numpy/pandas/sklearn
#   constraints below for MADD compatibility, and uses conda rdkit instead
#   of installing a second pip rdkit wheel.
# - MADD also lists torchdata==0.4.1, tensorflow, clr, sets, imolecule,
#   and some UI/agent packages. They are not imported by the migrated
#   sciMAS MCP tools and are left out to keep this environment solvable.
#
# SMDDBench compatibility notes:
# - The strict official runtime is still the upstream Dockerfile under
#   dataset/SMDDBench/upstream/evaluator/Dockerfile. It uses Python 3.10,
#   numpy 2.2, pandas 2.3, scikit-learn 1.7, and CUDA-oriented Boltz
#   extras. This combined sciMAS environment keeps MADD's Python/sklearn
#   constraints, so it is intended for best-effort native evaluation and
#   development rather than bit-for-bit reproduction of the Docker image.
# - CUDA cuequivariance ops are Linux-only and guarded with a pip platform
#   marker below; macOS native runs can evaluate non-Boltz tasks but will
#   not reproduce GPU Boltz metrics without a CUDA/Linux environment.
#
# PySCF (DFT) and xtb/CREST are intentionally NOT included — sciMAS
# excludes pyscf- and subprocess-binary-dependent tools. Add manually
# if you need them.

name: scimas
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.23,<2.0
  - scipy>=1.13
  - statsmodels>=0.14
  - scikit-learn=1.2.2
  - pandas>=2.0,<2.4
  - matplotlib>=3.7
  - seaborn>=0.12
  - beautifulsoup4>=4.12
  - lxml>=6.0
  - networkx>=3.0
  - nltk>=3.8
  - pillow>=9.0
  - joblib>=1.2
  - rdkit>=2025.09
  - openbabel=3.1.1
  - plip=3.0.0
  - requests>=2.31
  - urllib3>=1.26
  - certifi
  - pydantic>=2.0
  - python-dotenv>=1.0
  - fastapi>=0.100
  - uvicorn>=0.23
  - pyyaml>=6.0.2
  - openpyxl>=3.1
  - xlsxwriter>=3.1
  - tqdm>=4.65
  - pytest>=8.0
  - jupyter>=1.0
  - notebook>=7.0
  - ipykernel>=6.0
  - transformers>=4.40
  - sentencepiece>=0.1.99
  - pymupdf>=1.24
  - gemmi>=0.6
  - zarr>=2.0,<3.0
  - pandas-flavor>=0.6
  - pytorch>=2.1
  - tensorboard>=2.13
  - lightgbm>=4.0
  - catboost>=1.2
  - xgboost>=1.7
  - biopython>=1.84
  - protobuf>=4.0
  - pip:
      - mcp>=2.0
      - datasets>=5.0
      - huggingface_hub>=1.0
      - dill>=0.3
      - selfies>=2.1
      - SmilesPE>=0.0.3
      - torchtext==0.6.0
      - vina>=1.2
      - fedot>=0.7
      # SMDD-Bench official evaluator dependencies. These mirror the
      # upstream Dockerfile/requirements as closely as possible inside the
      # combined sciMAS environment.
      - boltz==2.2.1
      - biotite==1.2.0
      - cuequivariance-torch==0.8.1
      - "cuequivariance-ops-torch-cu12==0.9.1; platform_system == 'Linux'"
      # Upstream Docker installs admet-ai==1.2.0 with --no-deps to avoid an
      # overly strict pandas pin. Use the upstream requirements pin here
      # because conda environment.yml cannot safely scope --no-deps to one
      # package.
      - admet_ai==1.4.0
      - chemfunc==1.0.12
      - chemprop==1.6.1
      - descriptastorus==2.8.0
      - Flask==3.1.3
      - hyperopt==0.2.7
      - typed-argument-parser==1.11.0
      - "setuptools<81"
      - litellm==1.83.3
      - tenacity==9.1.4
      - chembl_webresource_client==0.10.9
      - boto3==1.43.11
      # BiOMNI core/agent/runtime packages mirrored from the AutoDL
      # biomni_e1 setup plus literature/database tool imports.
      - -e ../Biomni
      - gradio>=5.0,<6.0
      - langchain
      - langgraph==0.3.18
      - langchain-openai
      - langchain-anthropic
      - langchain-ollama
      - langchain-community
      - langchain-google-genai==2.1.8
      - openai
      - anthropic
      - tooluniverse
      - datadog-api-client
      - meeko
      - transcriptformer
      - arxiv
      - pymed
      - scholarly
      - googlesearch-python
      - PyPDF2
variables:
  MADD_ROOT: /Users/a123/Documents/games/MADD-main
  BIOMNI_ROOT: /Users/a123/Documents/games/Biomni
  BIOMNI_DATA_PATH: /Users/a123/Documents/games/biomni_data
  SMDD_BENCH_ROOT: /Users/a123/Documents/games/sciMAS/dataset/SMDDBench
